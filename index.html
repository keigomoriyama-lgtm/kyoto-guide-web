<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;line-height:1.4}
body{padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
#app{max-width:680px;margin:0 auto;min-height:100vh}
.hero{position:relative;height:220px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.92))}

.tabs{display:flex;gap:2px;margin:14px 16px;padding:3px;background:rgba(255,255,255,.07);border-radius:20px}
.tabs a{flex:1;height:48px;display:flex;align-items:center;justify-content:center;border-radius:17px;font-weight:900;font-size:15px;color:var(--dim)}

.pad{padding:0 16px 28px}
.stack{display:flex;flex-direction:column;gap:12px}
.tile{position:relative;display:block;height:135px;border-radius:18px;overflow:hidden;background:var(--card2)}

.bar h1{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard{display:flex;gap:12px;padding:10px;min-height:108px;background:var(--card);border-radius:16px}
.pcard .im{width:100px;height:88px;flex:none;border-radius:12px;overflow:hidden;background:var(--card2)}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.pcard .st{font-size:13px;font-weight:500;color:var(--dim);margin-top:4px}
.pcard .sd{font-size:12px;color:var(--faint);margin-top:4px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:30px;background:var(--card2)}
img.broken{display:none}
.cover{width:100%;height:260px;background:var(--card2);position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:24px;display:flex;flex-direction:column;gap:24px}
.cat{font-size:12px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,.6);text-transform:uppercase}
.h1{font-size:32px;font-weight:700;line-height:1.15;margin:8px 0 0}
.sub{font-size:20px;color:rgba(255,255,255,.7);margin-top:10px}
.box{background:var(--card2);border-radius:18px;padding:20px}
.box h2{margin:0 0 12px;font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center}

.box p{margin:0;line-height:1.65;color:rgba(255,255,255,.9);white-space:pre-line}

.box li{display:flex;gap:12px;line-height:1.55;color:rgba(255,255,255,.9)}
.box li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;margin-top:.6em}
.linkcard{display:flex;align-items:center;gap:14px;background:var(--card2);border-radius:18px;padding:20px}
.linkcard>svg{font-size:24px;color:var(--accent)}
.linkcard .tx{flex:1}.linkcard .tx b{display:block;font-size:17px}.linkcard .tx span{font-size:14px;color:rgba(255,255,255,.7)}
.gal h3{margin:0 0 12px;font-size:20px;font-weight:600}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{margin:0;width:225px;flex:none}

.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip figcaption{font-size:14px;font-weight:500;margin-top:7px}

.acard{position:relative;display:block;height:220px;border-radius:24px;overflow:hidden;background:var(--card2)}
.acard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.acard .t{position:absolute;left:22px;right:22px;bottom:20px}
.acard .n{font-size:28px;font-weight:900;text-transform:uppercase;line-height:1.1}
.acard .s{font-size:16px;font-weight:600;margin-top:6px;color:rgba(255,255,255,.9)}
.acard .r{font-size:16px;font-weight:700;margin-top:8px;color:var(--accent)}
.artcover{height:220px}
.hr{height:1px;background:var(--line);margin:0}

.slots{margin-top:14px;background:rgba(255,255,255,.055);border-radius:18px}
.slot{display:flex;gap:14px;padding:15px;border-top:1px solid rgba(255,255,255,.08)}
.slot:first-child{border-top:0}
.slot .l{width:78px;flex:none;font-size:11px;font-weight:800;letter-spacing:.8px;color:rgba(255,255,255,.45);text-transform:uppercase;padding-top:3px}

.notes p{margin:0 0 10px;font-size:15px;color:rgba(255,255,255,.78);white-space:pre-line}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;background:rgba(255,255,255,.14);color:#fff}

.ccard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ccard h3{margin:0;font-size:20px}.ccard .d{color:var(--dim);font-size:14px;margin-top:4px}
.ccard .jp{font-size:34px;font-weight:700;line-height:1.25;user-select:text}
.ccard .ro{color:var(--dim);font-size:15px}
.ccard .nt{border-top:1px solid var(--line);padding-top:12px;color:var(--dim);font-size:13px;white-space:pre-line}

.hotel .tx{padding:18px;display:flex;flex-direction:column;gap:14px}.hotel h3{margin:0;font-size:22px}.hotel p{margin:0;color:rgba(255,255,255,.8)}
.note{font-size:13px;color:var(--dim);padding:0 20px}
.link{color:var(--accent);font-size:14px;font-weight:600}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;margin:30px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#222;border:1px solid #444;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none}
#viewer.on{display:block}
#viewer .sc{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#viewer .sc::-webkit-scrollbar{display:none}
#viewer .sl{flex:none;width:100vw;height:100%;scroll-snap-align:center;position:relative;overflow:hidden;touch-action:pan-x}
#viewer .sl img{width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
#viewer .cp{position:absolute;left:20px;right:20px;bottom:calc(36px + env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 1px 4px #000}
#viewer .cp b{display:block;font-size:15px;font-weight:500}#viewer .cp span{font-size:12px;opacity:.7}
#viewer .x{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2}
#viewer .ct{position:absolute;top:calc(20px + env(safe-area-inset-top));left:20px;font-size:13px;opacity:.7;z-index:2}
pre.dbg{white-space:pre-wrap;font-size:12px;color:var(--dim);padding:0 16px}
</style>

erience": "You will enjoy an authentic Maiko photoshoot while learning about her training, daily life and traditions. The experience offers a rare opportunity to ask respectful questions and observe Kyoto's living culture.", "facts": ["Training usually lasts around five years.", "Different kimono are worn according to the season.", "Maiko wear their own natural hair styled in traditional fashions."], "image": "img/art_maiko.jpg"}, {"id": "geiko", "title": "Geiko", "subtitle": "Kyoto's traditional performing artists", "history": "In Kyoto the word Geiko is used instead of Geisha. After completing years of training as a Maiko, a Geiko becomes a professional artist dedicated to preserving Kyoto's classical performing arts through dance, music, conversation and hospitality.", "experience": "You will gain insight into the life of a Geiko, her training and the traditions that continue to thrive in Kyoto today. This experience offers a rare opportunity to appreciate one of Japan's most refined cultural professions.", "facts": ["Kyoto uses the word Geiko instead of Geisha.", "Many begin training during their teenage years.", "Traditional arts remain their full-time profession."], "image": "img/art_geiko.jpg"}, {"id": "ochaya", "title": "Ochaya", "subtitle": "Kyoto's exclusive tea houses", "history": "An Ochaya is a traditional tea house where Geiko and Maiko entertain guests through music, dance and conversation. Historically these establishments operated by invitation only and remain among Kyoto's most exclusive cultural spaces.", "experience": "Your visit offers a glimpse into an environment that few visitors ever experience. Learn about etiquette, hospitality and the role these houses have played in Kyoto society for centuries.", "facts": ["Many Ochaya have existed for generations.", "Most are located in Kyoto's historic entertainment districts.", "Traditionally guests entered by invitation."], "image": "img/art_ochaya.jpg"}, {"id": "butoh", "title": "Butoh", "subtitle": "The dance of darkness", "history": "Butoh emerged in post-war Japan through Tatsumi Hijikata and Kazuo Ohno as a radical new form of performance. Rejecting traditional aesthetics, it embraces slow movement, silence and emotional exploration.", "experience": "During the workshop you will discover how movement expresses emotion without relying on conventional dance techniques. Every participant is encouraged to interpret movement personally rather than imitate choreography.", "facts": ["Founded after World War II.", "Every performance is unique.", "Slow movement is one of its defining characteristics."], "image": "img/art_butoh.jpg"}, {"id": "shinto", "title": "Shinto & Buddhism", "subtitle": "Understanding Japan's spiritual traditions", "history": "For centuries, Shinto and Buddhism have coexisted throughout Japan. Shinto focuses on nature, purity and the worship of kami (spirits), while Buddhism explores enlightenment, compassion and the cycle of life. Many temples and shrines stand side by side, reflecting this unique cultural harmony.", "experience": "Throughout Kyoto you will visit both Shinto shrines and Buddhist temples. Learning the differences between them helps you understand the rituals, architecture and traditions you encounter during the workshop.", "facts": ["Most Japanese people participate in both Shinto and Buddhist traditions.", "Shrines are generally Shinto while temples are Buddhist.", "Kyoto contains thousands of important religious sites."], "image": "img/art_shinto.jpg"}, {"id": "photo", "title": "Photography Etiquette", "subtitle": "Respect creates better photographs", "history": "Photography is about more than making beautiful images. In Japan, showing respect for people, traditions and sacred places is considered an essential part of being a good photographer. Courtesy often opens doors that equipment alone never can.", "experience": "During the workshop you will learn how to approach people respectfully, recognise situations where photography is inappropriate and understand the etiquette expected inside temples, shrines and traditional cultural spaces.", "facts": ["Respect often results in more authentic photographs.", "Many temples prohibit flash photography.", "Some ceremonies should be experienced without taking photographs."], "image": "img/art_photo.jpg"}, {"id": "benrido", "title": "Benrido & Collotype Printing", "subtitle": "A Kyoto tradition of photographic fine-art printing", "history": "Founded in Kyoto in 1887, Benrido opened its in-house collotype studio in 1905. Collotype is a photographic printing process known for its subtle tonal gradations and detailed reproduction. A photographic negative serves as the master for the printing plate, and high-purity oil-based ink is used to print the image onto Japanese paper. The process has been used to reproduce important works of Japanese cultural heritage.\n\nBenrido subsequently developed a practical form of colour collotype, expanding a technique originally used for monochrome printing.", "experience": "Benrido connects photography, printmaking and cultural preservation. Its work shows how a photograph can become a carefully produced physical print, and how photographic reproduction can help record and share artworks and historic objects across generations.\n\nBenrido's Collotype Gallery is located at 302 Benzaitencho, Nakagyo-ku, Kyoto.", "facts": ["Benrido was founded in Kyoto in 1887.", "Its collotype studio opened in 1905.", "Collotype is valued for fine tonal reproduction and durability.", "Benrido developed its own practical colour-collotype technique."], "image": "img/art_benrido.jpg", "videoTitle": "Watch the Benrido video", "videoURL": "https://youtu.be/xaIEDHHbVs8"}];

/* ===== CSV ===== */
function parseCSV(text){
 if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'){row.push(f);f='';rows.push(row);row=[]}
  else if(c==='\r'){}
  else f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.map(r=>r.map(x=>x.replace(/\r\n?/g,'\n').trim()));
}
const key=s=>norm(s);

/* ===== FETCH (live Google Sheet, then optional repo snapshot) ===== */
const DIAG={};
async function fetchCSV(sheet,tab,snap,extra){
 const stamp=Date.now();
 const u=`https://docs.google.com/spreadsheets/d/${sheet}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}${extra||''}&cacheBust=${stamp}`;
 let err;
 try{
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  if(/^\s*</.test(t))throw new Error('Not CSV (is the sheet public?)');
  DIAG[tab]='live OK';return t;
 }catch(e){err=e}
 if(snap){
  try{
   const r=await fetch(`data/${snap}.csv?${stamp}`,{cache:'no-store'});
   if(r.ok){const t=await r.text();if(t.trim()&&!/^\s*</.test(t)){DIAG[tab]='snapshot (live failed: '+err.message+')';return t}}
  }catch(e){}
 }
 DIAG[tab]='FAILED: '+err.message;
 throw err;
}
const friendly=e=>/HTTP 40[13]|public/.test(e.message||'')?'Google Sheets is not publicly readable. Set General access to Anyone with the link → Viewer.':(e&&e.message&&!/Failed to fetch|NetworkError|Load failed/i.test(e.message)?e.message:'Could not connect to Google Sheets. Check the internet connection.');

function parsePlaces(text){
 const m=parseCSV(text);
 if(!m.length)throw new Error('The Places worksheet is empty.');
 const hdr=m[0],col={};
 hdr.forEach((t,i)=>{const k=key(t);if(k)col[k]=i});
 if(col.name==null||col.category==null)throw new Error('The Places worksheet needs at least name and category columns.');
 const v=(k,r)=>{const i=col[k];return i!=null&&i<r.length?r[i]:''};
 // visibility: shown ONLY if show_in_app is explicitly true
 const hl=hdr.map(h=>h.replace(/\uFEFF/g,'').trim().toLowerCase());
 const idIdx=hl.findIndex(h=>h==='id'||h==='place_id');
 const visIdx=hl.findIndex(h=>['show_in_app','is_visible','visible'].includes(h));
 const canon=id=>{const t=String(id).trim(),n=Number(t);return(t!==''&&Number.isFinite(n)&&Math.round(n)===n)?String(n):t};
 const hidden=new Set();
 if(idIdx>=0&&visIdx>=0){
  for(const r of m.slice(1)){
   const raw=(r[idIdx]||'').trim(),flag=(r[visIdx]||'').trim().toLowerCase();
   if(!raw||['true','1','yes','show','visible','on'].includes(flag))continue;
   hidden.add(canon(raw));
  }
 }
 const all=[];
 m.slice(1).forEach((r,off)=>{
  const name=v('name',r);if(!name)return;
  const cat=CATS[v('category',r).trim().toLowerCase()];if(!cat)return;
  const id0=v('id',r);
  const so=v('sortorder',r);
  const lat=parseFloat(v('latitude',r)),lng=parseFloat(v('longitude',r));
  all.push({id:id0||`${cat}-${name}-${off}`,name,category:cat,subtitle:v('subtitle',r),short:v('shortdescription',r),history:v('history',r),
   image:okUrl(v('imageurl',r)),map:okUrl(v('googlemapurl',r)),lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,
   sort:/^-?\d+$/.test(so)?parseInt(so,10):off,pdfTitle:v('pdftitle',r),pdfURL:okUrl(v('pdfurl',r))});
 });
 if(!all.length)throw new Error('No valid places were found. Check the category values in the Places worksheet.');
 return all.filter(p=>!hidden.has(canon(p.id)));
}
function normId(x){x=String(x||'').trim().toLowerCase();const n=Number(x);return(x!==''&&Number.isFinite(n)&&Math.round(n)===n)?String(Math.round(n)):x}
function parsePhotos(text){
 const rows=parseCSV(text);if(!rows.length)return [];
 const col={target_type:0,target_id:1,photographer:2,image_url:3,caption:4,sort_order:5};
 let data=rows;
 const h=rows.slice(0,3).findIndex(r=>r.map(x=>x.replace(/\uFEFF/g,'').trim().toLowerCase()).includes('target_type'));
 if(h>=0){rows[h].map(x=>x.replace(/\uFEFF/g,'').trim().toLowerCase()).forEach((n,i)=>{if(col[n]!=null)col[n]=i});data=rows.slice(h+1)}
 const out=[];
 for(const r of data){
  const g=k=>(r[col[k]]||'').trim();
  const type=g('target_type').toLowerCase();let tid=g('target_id');
  const n=Number(tid);if(tid!==''&&Number.isFinite(n)&&Math.round(n)===n)tid=String(Math.round(n));
  const url=g('image_url');
  if(!['place','art'].includes(type)||!tid||!/^https?:\/\/[^/]+/i.test(url))continue;
  out.push({type,tid,by:g('photographer'),url,cap:g('caption'),sort:Math.trunc(parseFloat(g('sort_order'))||0)});

const dayRx=/^(MO|TU|WE|TH|FR|SA|SU)\s*-\s*\d{1,2}\/\d{1,2}$/;
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function looksLikeDay(v){const u=String(v||'').toUpperCase().trim();return MONTHS.some(m=>u.includes(m))||dayRx.test(u)}
function parseSchedule(text){
 const mx=parseCSV(text);
 if(!mx.length)throw new Error('Google returned an empty first tab.');
 let hi=-1;
 for(let i=0;i<Math.min(40,mx.length);i++){if(mx[i].filter(looksLikeDay).length>=2){hi=i;break}}
 if(hi<0)throw new Error('Could not find the day/date row in the first tab.');
 const header=mx[hi];
 const cols=header.map((_,i)=>i).filter(i=>looksLikeDay(header[i]));
 if(cols.length<2)throw new Error('Could not identify the itinerary day columns.');
 const focus={},slots={};const notes=[];let inNotes=false;
 const val=(r,c)=>c<r.length?r[c]:'';
 for(let ri=hi+1;ri<mx.length;ri++){
  const row=mx[ri];
  const label=(row.find(x=>x!=='')||'').trim();
  const nl=norm(label);
  if(nl==='additionalnotes'){inNotes=true;continue}
  if(inNotes){const n=row.find(x=>x!=='')||'';if(n&&!notes.includes(n))notes.push(n);continue}
  if(nl==='workshopfocus'){for(const c of cols){const t=val(row,c);if(t)focus[c]=t}continue}
  if(!label||label.startsWith('*'))continue;
  for(const c of cols){const t=val(row,c);if(!t)continue;(slots[c]=slots[c]||[]).push({label,content:t,order:ri})}
 }
 const days=cols.map(c=>({title:header[c],focus:focus[c]||'',slots:slots[c]||[]}));
 return {days,notes};
}

 const v=(r,k)=>{const i=col[k];return i!=null&&i<r.length?r[i].trim():''};

function coverFor(cat){
 const list=placesIn(cat);
 const bad=p=>{const n=norm(p.name);return cat==='Camera Shops'&&(n.includes('arashiyama')||n.includes('bambooforest'))};
 for(const pref of COVERS[cat]||[]){

  const p=list.find(x=>norm(x.name)===t)||list.find(x=>{const n=norm(x.name);return n.includes(t)||t.includes(n)});
  if(!p||!p.image)continue;
  if(bad(p))continue;
  return p.image;
 }

 return f?f.image:'';

const ALIASES={nanzenjitemple:['nanzenji'],heianjingushrineandgardens:['santuarioheian'],otaginenbusujitemple:['otaginenbutsuji'],otaginenbutsujitemple:['otaginenbutsuji'],bambooforest:['arashiyama'],adashinonenbutsujitemple:['adashinonenbutsujitemple'],yasakashrine:['yasakashrine']};
function placesMatching(text){
 const nt=norm(text);if(!nt)return [];
 const matches=[];
 for(const p of S.places){
  const canonical=norm(p.name);if(!canonical)continue;
  let best=null;
  const consider=c=>{if(!c)return;const pos=nt.indexOf(c);if(pos<0)return;
   if(!best||c.length>best.len||(c.length===best.len&&pos<best.pos))best={pos,len:c.length}};
  consider(canonical);
  ['temple','shrine','gardens','garden'].map(w=>canonical.split(w).join('')).filter(x=>x.length>=5).forEach(consider);
  for(const sn of Object.keys(ALIASES)){
   if(nt.includes(sn)){for(const g of ALIASES[sn]){if(g===canonical){const pos=nt.indexOf(sn);if(!best||sn.length>best.len)best={pos,len:sn.length}}}}
  }
  if(best)matches.push({p,pos:best.pos,len:best.len});
 }
 matches.sort((a,b)=>a.pos-b.pos||b.len-a.len);
 const sel=[];
 for(const m of matches){
  const ov=sel.some(e=>Math.max(e.pos,m.pos)<Math.min(e.pos+e.len,m.pos+m.len));
  if(!ov)sel.push(m);
 }
 const seen=new Set();
 return sel.map(m=>m.p).filter(p=>!seen.has(p.id)&&seen.add(p.id));
}

}

 let changed=false;
 try{
  const [a,b]=await Promise.allSettled([fetchCSV(PLACES_SHEET,'Guide Photos','guide_photos'),fetchCSV(PLACES_SHEET,'Art Photos','art_photos')]);
  const merged=[];const seen=new Set();let ok=false;
  for(const r of [a,b]){if(r.status!=='fulfilled')continue;ok=true;
   for(const p of parsePhotos(r.value)){const k=p.type+'-'+p.tid+'-'+p.sort+'-'+p.url;if(!seen.has(k)){seen.add(k);merged.push(p)}}}
  if(ok&&merged.length){changed=!same(merged,S.photos);S.photos=merged;ls.set('photos',merged)}
 }catch(e){}
 S.busy.photos=false;return changed;
}
// Staff / Documents / Emergency / Japanese: fetched when the screen opens.
// A failed fetch keeps the saved copy; an EMPTY successful fetch clears it.
const LISTS={
 staff:{sheet:PLACES_SHEET,tab:'Staff',parse:parseStaff,key:'staff'},
 docs:{sheet:PLACES_SHEET,tab:'PDFs',parse:parseDocs,key:'docs'},
 emerg:{sheet:PLACES_SHEET,tab:'Emergency',parse:parseEmergency,key:'emerg',snap:'emergency'},
 jp:{sheet:PLACES_SHEET,tab:'Japanese',parse:parseJapanese,key:'jp',snap:'japanese'}
};
async function refreshList(name){
 const L=LISTS[name];if(S.busy[name])return false;S.busy[name]=true;
 let changed=false;
 try{
  const v=L.parse(await fetchCSV(L.sheet,L.tab,L.snap));
  changed=!same(v,S[name]);S[name]=v;
  if(v.length)ls.set(L.key,v);else ls.del(L.key);
 }catch(e){}
 S.busy[name]=false;S.done[name]=true;
 return changed||true; // also redraws the "loading" state
}
let lastRefresh=0;

 lastRefresh=Date.now();

 if(r.some(Boolean))render(true);

/* ===== ROUTER ===== */
let cur='',trail=[],replacing=false;const scrollPos={};
function route(){
 const parts=(location.hash.replace(/^#\/?/,'')||'loc').split('/').filter(Boolean).map(decodeURIComponent);
 const [a,b]=parts;
 switch(a){
  case 'arts':return vArts();
  case 'sched':return vSched();
  case 'cat':return vCat(b);
  case 'place':return vPlace(b);
  case 'art':return vArt(b);
  case 'debug':return vDebug();
  case 'menu':
   switch(b){
    case 'emergency':return vEmergency();
    case 'japanese':return vJapanese();
    case 'hotels':return vHotels();
    case 'docs':return vDocs();
    case 'staff':return vStaff();
    default:return vMenu();
   }
  default:return vLoc();
 }
}
let parentHash='#/loc';
function render(keep){
 const y=window.scrollY;
 const r=route();parentHash=r.parent||'#/loc';
 document.getElementById('app').innerHTML=r.html;
 window.scrollTo(0,keep?y:(scrollPos[location.hash||'#/loc']||0));
}
function enter(){ // once per navigation: load the lists a screen needs
 const p=(location.hash.replace(/^#\/?/,'')||'loc').split('/');
 if(p[0]!=='menu')return;
 const name={emergency:'emerg',japanese:'jp',docs:'docs',staff:'staff'}[p[1]];
 if(!name||S.busy[name])return;
 const h=location.hash;
 refreshList(name).then(()=>{if(location.hash===h)render(true)});
}
window.addEventListener('hashchange',()=>{
 const h=location.hash||'#/loc';
 if(replacing){trail[trail.length-1]=h;replacing=false}
 else if(trail.length>1&&trail[trail.length-2]===h)trail.pop();
 else trail.push(h);
 cur=h;enter();render(false);
});
window.addEventListener('scroll',()=>{scrollPos[cur||location.hash||'#/loc']=window.scrollY},{passive:true});
function goBack(){if(trail.length>1)history.back();else{replacing=true;location.replace(parentHash)}}
function manualRefresh(fromMenu){refreshAll(true);if(fromMenu&&trail.length>1)history.back()}
document.addEventListener('click',e=>{
 const t=e.target.closest('a[data-tab]');
 if(t){e.preventDefault();if(location.hash!==t.getAttribute('href')){replacing=true;location.replace(t.getAttribute('href'))}return}
 const g=e.target.closest('[data-g]');
 if(g){const [type,id]=g.dataset.g.split('|');openViewer(photosFor(type,id),+g.dataset.i);return}
 const s=e.target.closest('[data-say]');
 if(s){speak(s.dataset.say);return}
});
function speak(text){
 if(!('speechSynthesis' in window)){toast('Speech is not supported on this device');return}
 const v=speechSynthesis.getVoices();
 if(v.length&&!v.some(x=>/^ja/i.test(x.lang))){toast('No Japanese voice installed on this device');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);
}

/* ===== FULLSCREEN PHOTO VIEWER (swipe, pinch zoom, double-tap) ===== */
let viewerOpen=false;
function openViewer(photos,start){
 if(!photos.length)return;
 const v=document.getElementById('viewer');
 v.innerHTML=`<button class="x" aria-label="Close">${ic('x')}</button>${photos.length>1?`<div class="ct"></div>`:''}<div class="sc">${photos.map(p=>`<div class="sl"><img alt="" src="${esc(imgSrc(p.url))}" draggable="false">
 ${p.cap||p.by?`<div class="cp">${p.cap?`<b>${esc(p.cap)}</b>`:''}${p.by?`<span>${esc(p.by)}</span>`:''}</div>`:''}</div>`).join('')}</div>`;
 v.classList.add('on');document.documentElement.style.overflow='hidden';
 const scr=v.querySelector('.sc'),ct=v.querySelector('.ct');
 requestAnimationFrame(()=>{scr.scrollTo({left:start*scr.clientWidth,behavior:'instant'});upd()});
 const upd=()=>{if(ct)ct.textContent=(Math.round(scr.scrollLeft/(scr.clientWidth||1))+1)+' / '+photos.length};
 scr.addEventListener('scroll',upd,{passive:true});
 v.querySelectorAll('.sl').forEach(sl=>zoomable(sl,scr));
 v.querySelector('.x').onclick=()=>closeViewer(true);
 history.pushState({viewer:1},'');viewerOpen=true;
}
function closeViewer(pop){
 if(!viewerOpen)return;viewerOpen=false;
 const v=document.getElementById('viewer');v.classList.remove('on');v.innerHTML='';document.documentElement.style.overflow='';
 if(pop&&history.state&&history.state.viewer)history.back();
}
window.addEventListener('popstate',()=>{if(viewerOpen)closeViewer(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer(true)});
function zoomable(sl,scr){
 const im=sl.querySelector('img');let sc=1,tx=0,ty=0,d0=0,s0=1;const pts=new Map();
 const apply=()=>{im.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;scr.style.overflowX=sc>1.01?'hidden':'auto';sl.style.touchAction=sc>1.01?'none':'pan-x'};
 sl.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);s0=sc}});
 sl.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;const pv=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [a,b]=[...pts.values()];sc=Math.min(5,Math.max(1,s0*Math.hypot(a.x-b.x,a.y-b.y)/d0));if(sc===1){tx=ty=0}apply()}
  else if(pts.size===1&&sc>1.01){tx+=e.clientX-pv.x;ty+=e.clientY-pv.y;apply()}
 });
 const up=e=>{pts.delete(e.pointerId);if(sc<=1.01){sc=1;tx=ty=0;apply()}};
 sl.addEventListener('pointerup',up);sl.addEventListener('pointercancel',up);
 sl.addEventListener('dblclick',()=>{if(sc>1.01){sc=1;tx=ty=0}else sc=2.5;apply()});
}

/* ===== START ===== */
(function init(){
 cur=location.hash||'#/loc';trail=[cur];
 enter();render(false);
 refreshAll(false);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefresh>15*60*1000)refreshAll(false)});
 window.addEventListener('online',()=>refreshAll(false));
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
